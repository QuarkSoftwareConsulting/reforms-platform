name: reforma-hub

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: reforma-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: reforma
      POSTGRES_PASSWORD: reforma
      POSTGRES_DB: reforma_hub
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reforma -d reforma_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Base de datos dedicada a los tests de integracion (se limpia sin tocar la de dev).
  db-test:
    image: postgis/postgis:16-3.4
    container_name: reforma-hub-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: reforma
      POSTGRES_PASSWORD: reforma
      POSTGRES_DB: reforma_hub_test
    ports:
      - "5434:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reforma -d reforma_hub_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Almacenamiento S3-compatible para las fotos de los leads.
  # El adaptador S3S es el mismo en dev (MinIO) y en produccion (Cloudflare R2).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: reforma-hub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reformahub
      MINIO_ROOT_PASSWORD: reformahub123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: reforma-hub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 reformahub reformahub123 &&
      mc mb --ignore-existing local/reforma-hub-dev &&
      mc anonymous set download local/reforma-hub-dev &&
      echo 'bucket reforma-hub-dev listo'
      "

volumes:
  db-data:
  minio-data:
