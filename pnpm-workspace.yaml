packages:
  - "apps/web"

# Paquetes autorizados a ejecutar sus scripts de instalacion: sharp (optimizacion de
# imagenes de Next), esbuild (bundler de Vitest), unrs-resolver (resolucion de modulos
# de ESLint) y los binarios nativos de Firebase. pnpm 11 exige declararlos.
allowBuilds:
  "@firebase/util": true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
